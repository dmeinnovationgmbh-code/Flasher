name: Build desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: med17flasher-desktop-linux
          - os: windows-latest
            asset: med17flasher-desktop-windows.exe
          - os: macos-latest
            asset: med17flasher-desktop-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build web UI
        working-directory: webui
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller && pip install -e .

      - name: Build desktop binary
        run: pyinstaller --clean --noconfirm packaging/med17flasher.spec

      - name: Rename artifact (unix)
        if: runner.os != 'Windows'
        run: mv dist/med17flasher-desktop "dist/${{ matrix.asset }}"
      - name: Rename artifact (windows)
        if: runner.os == 'Windows'
        run: mv dist/med17flasher-desktop.exe "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
