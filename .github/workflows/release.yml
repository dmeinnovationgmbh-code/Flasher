name: Build desktop app

on:
  push:
    tags: ["v*"]
    branches: ["claude/**"]   # also build downloadable artifacts on the dev branch
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: med17flasher-desktop-linux
          - os: windows-latest
            asset: med17flasher-desktop-windows.exe
          - os: macos-latest
            asset: med17flasher-desktop-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build web UI
        working-directory: webui
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller && pip install -e .

      - name: Build desktop binary
        run: pyinstaller --clean --noconfirm packaging/med17flasher.spec

      - name: Rename artifact (unix)
        if: runner.os != 'Windows'
        run: mv dist/med17flasher-desktop "dist/${{ matrix.asset }}"
      - name: Rename artifact (windows)
        if: runner.os == 'Windows'
        run: mv dist/med17flasher-desktop.exe "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      # Windows: also wrap the .exe in a classic Inno Setup installer with
      # Start-menu + desktop shortcuts, so users can "install" it the usual way.
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # PyInstaller wrote dist/med17flasher-desktop.exe -> put it back under
          # the name the .iss expects, then compile the installer.
          Copy-Item "dist/${{ matrix.asset }}" "dist/med17flasher-desktop.exe" -Force
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -notmatch '^\d') { $ver = "1.0.0" }
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$ver" packaging\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/installer/med17flasher-setup.exe")) {
            throw "installer was not produced at dist/installer/med17flasher-setup.exe"
          }
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: med17flasher-setup-windows
          path: dist/installer/med17flasher-setup.exe

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach Windows installer to release
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/med17flasher-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
